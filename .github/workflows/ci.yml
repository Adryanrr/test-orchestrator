name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Run API tests
        run: pytest api/tests/ --junitxml=reports/api-results.xml --html=reports/api-report.html --self-contained-html
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r web/requirements.txt
      - name: Run Web tests
        run: pytest web/tests/ --junitxml=reports/web-results.xml --html=reports/web-report.html --self-contained-html
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report
          path: reports/

  auto-merge-to-developer:
    needs: [api-tests, web-tests]
    runs-on: ubuntu-latest
    # Roda apenas em push de branches de feature (não em developer nem main)
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/developer' &&
      github.ref != 'refs/heads/main'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create PR and auto-merge into developer
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          EXISTING=$(gh pr list --head "$BRANCH" --base developer --state open --json number -q ".[0].number")
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base developer \
              --head "$BRANCH" \
              --title "merge: $BRANCH → developer" \
              --body "🤖 PR automático — todos os testes passaram no CI."
          fi
          gh pr merge "$BRANCH" --squash --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
